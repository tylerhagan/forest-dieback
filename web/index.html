<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Forest Change Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&family=Public+Sans:ital,wght@0,400..800;1,400..800&family=Sora:wght@300..700&display=swap">
<link rel="stylesheet" href="src/styles.css">
</head>
<body>
<!--app-->
<script>
  // pick the theme before first paint: ?theme= wins, then the viewer's last choice
  (function () {
    var ok = ["field", "civic", "orbital"], t = null;
    try { t = new URLSearchParams(location.search).get("theme"); } catch (e) {}
    if (ok.indexOf(t) < 0) { try { t = localStorage.getItem("fce-theme"); } catch (e) {} }
    document.documentElement.dataset.theme = ok.indexOf(t) < 0 ? "field" : t;
  })();
</script>
<div class="shell">
  <header class="bar">
    <div class="brand">
      <h1 id="title">Forest Change Explorer</h1>
      <p class="place" id="place"></p>
    </div>
    <div class="tools">
    <fieldset class="themes" role="radiogroup" aria-label="Style">
      <legend>Style</legend>
      <button role="radio" data-theme-pick="field" aria-checked="false">Field sheet</button>
      <button role="radio" data-theme-pick="civic" aria-checked="false">Civic</button>
      <button role="radio" data-theme-pick="orbital" aria-checked="false">Orbital</button>
    </fieldset>
    <div class="controls">
      <div class="seg" role="radiogroup" aria-label="Map layer">
        <button role="radio" data-layer="rgb" aria-checked="false">Imagery</button>
        <button role="radio" data-layer="ndvi" aria-checked="false">Vegetation</button>
        <button role="radio" data-layer="change" aria-checked="true">Loss</button>
      </div>
      <button class="tool" id="btn-compare" aria-pressed="false">Compare</button>
      <button class="tool" id="btn-area" aria-pressed="false">Select an area</button>
    </div>
    </div>
  </header>

  <main class="stage">
    <section class="mapzone" aria-label="Map and timeline">
      <div class="map" id="map">
        <canvas id="canvas" aria-label="Map. Drag to pan, pinch or scroll to zoom, tap to inspect a spot."></canvas>
        <div class="readout" id="readout" hidden></div>
        <div class="hint" id="hint">Tap anywhere to see that spot's history</div>
        <div class="cmp left" id="cmp-left" hidden></div>
        <div class="cmp right" id="cmp-right" hidden></div>
        <div class="legend" id="legend"></div>
        <div class="scale" id="scale"><span class="scale-bar"></span><span class="scale-text"></span></div>
        <button class="fit" id="btn-fit">Fit</button>
        <span class="sim" id="sim-badge" hidden>Simulated data</span>
      </div>

      <div class="timeline">
        <button class="play" id="btn-play" aria-label="Play through the years">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path id="play-icon" d="M4 2.5v11l9-5.5z"/></svg>
        </button>
        <div class="years" id="years" role="slider" tabindex="0" aria-label="Year"></div>
      </div>
      <p class="years-cap"><span id="cap-left">Forest lost each year</span><span>Line under each year: how many cloud-free views that summer</span></p>
    </section>

    <aside class="rail">
      <section class="panel verdict" id="verdict" aria-live="polite"></section>
      <section class="panel spot" id="spot"></section>
      <details class="panel method">
        <summary>How this works</summary>
        <div id="method"></div>
      </details>
    </aside>
  </main>
</div>
<!--/app-->
<script type="module" src="src/app.js"></script>
</body>
</html>
